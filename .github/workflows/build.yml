name: Build check and release

# Every push to main runs the installer's FULL Windows build
# (-Mode Build: emit, compile, shell MSI, bundle) on a Windows runner
# with the exact pinned toolchain (SDK 10.0.100, WiX 7.0.1). When the
# build passes, the release job publishes a GitHub Release for the
# build stamp if one does not exist yet, with the installer attached.
#
# The repo copy of the installer keeps its redistributable SHA-256
# slots empty on purpose (issue #8: the operator records the hashes of
# THEIR redist files). The CI job downloads the three redistributables,
# fills the slots in its own checked-out copy with the hashes of the
# files it downloaded, and builds that copy. The release ships the
# pristine repo installer, never the CI copy or the CI bundle.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Full Windows build
    runs-on: windows-latest
    outputs:
      stamp: ${{ steps.inst.outputs.stamp }}
      file: ${{ steps.inst.outputs.file }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the pinned .NET SDK (10.0.100)
        shell: pwsh
        run: |
          # A workspace-local dotnet root holding exactly the pinned SDK.
          # The runner image preinstalls other SDKs (and may preset
          # DOTNET_ROOT to them); a local root plus an explicit
          # DOTNET_ROOT and PATH entry makes `dotnet --version` resolve
          # to 10.0.100 deterministically.
          $dir = Join-Path $PWD '.dotnet'
          Invoke-WebRequest 'https://dot.net/v1/dotnet-install.ps1' -OutFile 'dotnet-install.ps1'
          .\dotnet-install.ps1 -Version '10.0.100' -InstallDir $dir
          "DOTNET_ROOT=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install WiX (pinned 7.0.1)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 7.0.1
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Verify the toolchain pins
        shell: pwsh
        run: |
          $sdk = dotnet --version
          Write-Host "dotnet --version: $sdk"
          dotnet --list-sdks
          if ($sdk -ne '10.0.100') { throw "SDK pin not in effect: dotnet resolved to $sdk, expected 10.0.100." }
          $wix = (wix --version) -split '\+' | Select-Object -First 1
          Write-Host "wix --version: $wix"
          if ($wix.Trim() -ne '7.0.1') { throw "WiX pin not in effect: wix resolved to $wix, expected 7.0.1." }
      - name: Locate the installer
        id: inst
        shell: pwsh
        run: |
          $f = Get-ChildItem -Filter '*_Install-Atrium.ps1' | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $f) { throw 'No *_Install-Atrium.ps1 at the repo root.' }
          "file=$($f.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "stamp=$($f.Name -replace '_Install-Atrium\.ps1$','')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Parse-check the installer
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.PSParser]::Tokenize([IO.File]::ReadAllText('${{ steps.inst.outputs.file }}'), [ref]$errors) | Out-Null
          if ($errors -and $errors.Count) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Host 'Parse OK'
      - name: Download the redistributables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path redist -Force | Out-Null
          Invoke-WebRequest 'https://get.enterprisedb.com/postgresql/postgresql-17.4-1-windows-x64.exe' -OutFile 'redist/postgresql-17.4-windows-x64.exe'
          Invoke-WebRequest 'https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/10.0.0/dotnet-hosting-10.0.0-win.exe' -OutFile 'redist/dotnet-hosting-10.0.0-win.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile 'redist/MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
          Get-ChildItem redist | Select-Object Name, Length
      - name: Fill the redist hash slots in the CI copy
        shell: pwsh
        run: |
          $path = '${{ steps.inst.outputs.file }}'
          $text = [IO.File]::ReadAllText($path)
          $map = [ordered]@{
            PgInstallerSha256       = 'redist/postgresql-17.4-windows-x64.exe'
            HostingBundleSha256     = 'redist/dotnet-hosting-10.0.0-win.exe'
            WebView2InstallerSha256 = 'redist/MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
          }
          foreach ($k in $map.Keys) {
            $hash = (Get-FileHash $map[$k] -Algorithm SHA256).Hash
            $pattern = "(?m)^(\s*$k\s*=\s*)''"
            if ($text -notmatch $pattern) { throw "Hash slot $k not found in the installer config." }
            $text = $text -replace $pattern, "`$1'$hash'"
            Write-Host "$k <- $hash"
          }
          [IO.File]::WriteAllText($path, $text)
      - name: Run the full build
        shell: pwsh
        run: |
          & ./${{ steps.inst.outputs.file }} -Mode Build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'Atrium-Bundle/manifest.json')) { throw 'Bundle manifest missing.' }
          if (-not (Test-Path 'Atrium-Bundle/payload/shell/Atrium.msi')) { throw 'Shell MSI missing from the bundle.' }
          Write-Host 'Bundle contents:'
          Get-ChildItem -Recurse Atrium-Bundle | ForEach-Object { $_.FullName }
      - name: Post the build log tail to issue #7 on failure
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $log = Get-ChildItem (Join-Path $env:TEMP 'Atrium-Logs') -Filter '*.log' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1
          $body = Join-Path $PWD 'build-failure.md'
          if ($log) {
            $tail = (Get-Content $log.FullName -Tail 120) -join "`n"
            @("Build check failed for commit $env:GITHUB_SHA (run $env:GITHUB_RUN_ID). Last lines of the installer run log ($($log.Name)):", '', '```', $tail, '```') | Set-Content $body
          } else {
            @("Build check failed for commit $env:GITHUB_SHA (run $env:GITHUB_RUN_ID). No installer run log was found under TEMP\Atrium-Logs.") | Set-Content $body
          }
          gh issue comment 7 --body-file $body

  release:
    name: Publish the installer release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Create the release if this build has none
        env:
          GH_TOKEN: ${{ github.token }}
          STAMP: ${{ needs.build.outputs.stamp }}
          INSTALLER: ${{ needs.build.outputs.file }}
        run: |
          tag="build-$STAMP"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; skipping."
            exit 0
          fi
          cat > notes.md <<'EOF'
          **Early alpha — not for production use.**

          The installer for this build is attached below. The installer is
          the release: it embeds the entire system (server, client, desktop
          shell, database schema) and builds and deploys from the single
          file.

          Published by the build-check workflow after a full Windows build
          of this exact installer passed — emit, compile, shell MSI, and
          bundle manifest verification.
          EOF
          gh release create "$tag" "$INSTALLER" --title "Atrium build $STAMP (early alpha)" --notes-file notes.md --prerelease
